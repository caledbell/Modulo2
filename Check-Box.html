<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Materias y modalidad</title>
</head>
<body>
<div class="container mt-4">
    <p class="fw-bold mb-1">Materias favoritas:</p>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="Biologia">
        <label class="form-check-label" for="Biologia">Biologia</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="matematicas">
        <label class="form-check-label" for="matematicas">Matemáticas</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="checkbox" id="ingles">
        <label class="form-check-label" for="ingles">Inglés</label>
    </div>
    <p class="fw-bold mt-3 mb-1">Modalidad:</p>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="modalidad" id="presencial">
        <label class="form-check-label" for="presencial">Presencial</label>
    </div>
    <div class="form-check">
        <input class="form-check-input" type="radio" name="modalidad" id="virtual">
        <label class="form-check-label" for="virtual">Virtual</label>
    </div>
</div>
</body>
</html>
